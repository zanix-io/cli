# .github/workflows/drift-watch.yml
#
# Drift Watch (engineering.md §8.2) — regenerates every `zanix new` project type plus a
# representative `zanix generate` variant matrix against the REAL latest published version of
# every Zanix dependency, and runs `deno check` against each. Detects upstream API drift as early
# as possible.
#
# Deliberately informational, not a required check: this workflow is never referenced by branch
# protection and never gates `publish.yml` — a red run here means an upstream Zanix package
# changed in a way that broke generation (or hasn't published yet, see engineering.md §7), not
# that this repo introduced a regression. See `scripts/drift-watch.ts` for the actual check.

name: Drift Watch

on:
  schedule:
    # Every Monday at 06:00 UTC — catches upstream releases even when nothing in this repo changed.
    - cron: '0 6 * * 1'
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  drift-watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Drift Watch
        run: deno run -A scripts/drift-watch.ts
