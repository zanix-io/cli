# .github/workflows/publish.yml

name: Publish

on:
  push:
    branches:
      - master 

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Allows reading of the repository's contents.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run tests
        run: deno test --allow-all
       
      - name: Run Deno task build 
        run: deno task build --obfuscate
      
      - name: Publish to Deno
        run: deno publish --token ${{secrets.JSR}}
