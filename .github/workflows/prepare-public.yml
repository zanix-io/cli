# .github/workflows/publish.yml

name: Prepare public

on:
  push:
    branches:
      - master 

jobs:
  prepare-public:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Initialize and update submodules
        run: git submodule update --init --recursive
  
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run Deno task build 
        run: deno task build

      - name: Copy build to
        run: |
          mkdir bundle/.dist/
          cp .dist/app.mjs bundle/.dist/
          cp deno.jsonc bundle/deno.jsonc
          cp README.md bundle/README.md 
          cd bundle

      - name: Copy build to target repository
        run: |
          git add .
          git commit -m "Automatic build action"
          git push origin master 

      - name: Trigger trigger-publish-cli on Public repo
        run: |
          curl -X POST \
          https://api.github.com/repos/zanix-io/bundles-cli/dispatches \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -d '{"event_type": "trigger-publish-cli"}'