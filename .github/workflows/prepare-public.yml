# .github/workflows/publish.yml

name: Prepare public

on:
  push:
    branches:
      - master 

jobs:
  prepare-public:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run Deno task build 
        run: deno task build

      - name: Clone target repository and copy files
        run: |
          git clone https://github.com/zanix-io/bundles-cli.git
          mkdir bundles-cli/.dist/
          cp .dist/app.mjs bundles-cli/.dist/
          cp deno.jsonc bundles-cli/deno.jsonc
          cp README.md bundles-cli/README.md 
          cd bundles-cli

      - name: Copy build to target repository
        run: |
          git config --global user.name 'GitHub Actions'
          git add .
          git commit -m "Automatic build action"
          git push origin master 

      - name: Trigger trigger-publish-cli on Public repo
        run: |
          curl -X POST \
          https://api.github.com/repos/zanix-io/bundles-cli/dispatches \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -d '{"event_type": "trigger-publish-cli"}'